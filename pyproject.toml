[project]
name = "personalautomatedresearchanalyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chaithra Anchatgeri", email = "you@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.1.0",
    "arxiv>=4.0.1",
    "fastmcp[apps]>=4.1.1",
    "groq>=1.7.0",
    "langchain-experimental>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
personalautomatedresearchanalyst = "personalautomatedresearchanalyst:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
